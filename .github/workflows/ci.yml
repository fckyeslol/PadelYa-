name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # Node 24 y no 20: las deps ya pedían >=22 y el CI corría por debajo.
      # `undici` (dependencia directa) declara engines >=22.19.0 y jsdom 30
      # pide ^22.22.2 || ^24.15.0. En Node 20 no existe `markAsUncloneable` en
      # node:worker_threads, así que undici lo deja undefined y jsdom explota al
      # construir su CacheStorage — con TODOS los tests en verde, porque es un
      # unhandled error de carga, no una assertion.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Full Vitest suite. TEST_DATABASE_URL enables the DB-gated tests
      # (the SQL claim flow) against the Postgres service above; without it
      # those specs skip.
      - name: Test
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
